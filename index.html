<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <title>Dodi Banzon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%232997ff'/><stop offset='1' stop-color='%23bf5af2'/></linearGradient></defs><rect width='100' height='100' rx='23' fill='url(%23g)'/><text x='50' y='70' font-size='56' font-weight='700' font-family='Helvetica,Arial,sans-serif' fill='white' text-anchor='middle'>D</text></svg>" />
  <meta name="description" content="Dodi Banzon — data scientist in training. Applied Physics background. Health financing data analysis and policy research." />

  <style>
    /* ── Tokens ── */
    :root {
      color-scheme: dark;
      --bg:        #000000;
      --bg2:       #0a0a0c;
      --surface:   #1d1d1f;
      --surface2:  #161617;
      --border:    rgba(255,255,255,.1);
      --text:      #f5f5f7;
      --text2:     #d2d2d7;
      --muted:     #86868b;
      --accent:    #2997ff;
      --accent-btn:       #0071e3;
      --accent-btn-hover: #0077ed;
      --purple:    #bf5af2;
      --cyan:      #64d2ff;
      --green:     #30d158;
      --red:       #ff453a;
      --grad:      linear-gradient(110deg, #2997ff 0%, #bf5af2 55%, #ff375f 100%);
      --ease:      cubic-bezier(.28,.11,.32,1);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 1.0625rem;
      line-height: 1.47;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    code {
      font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
      background: rgba(255,255,255,.08);
      padding: .1em .4em;
      border-radius: 6px;
      font-size: .9em;
    }
    ::selection { background: var(--accent-btn); color: #fff; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* ── Gradient text ── */
    .text-grad {
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    /* ── Layout ── */
    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 1.375rem;
    }

    /* ── Nav ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: .8rem 0;
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(22,22,23,.8);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }
    .brand {
      font-size: 1.0625rem;
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--text);
      cursor: pointer;
    }
    .brand-dim { color: var(--muted); font-weight: 500; }

    .nav-links {
      display: flex;
      gap: .35rem;
      list-style: none;
    }
    .nav-links a {
      padding: .4rem .8rem;
      border-radius: 980px;
      font-size: .8125rem;
      letter-spacing: -.01em;
      color: rgba(245,245,247,.65);
      transition: color .25s var(--ease), background .25s var(--ease);
    }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active {
      color: var(--text);
      background: rgba(255,255,255,.1);
    }

    /* ── Page engine ── */
    #page {
      opacity: 1;
      transform: translateY(0);
      transition: opacity .18s var(--ease), transform .18s var(--ease);
    }
    #page.leaving {
      opacity: 0;
      transform: translateY(10px);
    }

    /* ── Shared section helpers ── */
    .pt { padding-top: 5rem; }
    .pb { padding-bottom: 5rem; }
    .spacer-sm { height: 1rem; }
    .spacer-lg { height: 5rem; }
    .section-label {
      display: inline-block;
      width: fit-content;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -.01em;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      margin-bottom: .75rem;
    }
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2.75rem 0;
    }

    /* ── HOME ── */
    .hero {
      min-height: min(720px, calc(100dvh - 60px));
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 5rem 0 3.5rem;
      position: relative;
    }
    .hero-glow {
      position: absolute;
      top: -5%;
      right: -20%;
      width: 640px;
      height: 640px;
      background:
        radial-gradient(closest-side at 60% 40%, rgba(41,151,255,.16), transparent),
        radial-gradient(closest-side at 35% 65%, rgba(191,90,242,.12), transparent);
      pointer-events: none;
      border-radius: 50%;
    }
    .hero > :not(.hero-glow) { position: relative; animation: rise .6s var(--ease) both; }
    .hero > *:nth-child(3) { animation-delay: .06s; }
    .hero > *:nth-child(4) { animation-delay: .12s; }
    .hero > *:nth-child(5) { animation-delay: .18s; }
    .hero > *:nth-child(6) { animation-delay: .24s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .hero-eyebrow {
      font-size: 1.0625rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }
    .hero h1 {
      font-size: clamp(2.6rem, 6.5vw, 4.5rem);
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: -.025em;
      margin-bottom: 1.75rem;
    }
    .hero-desc {
      max-width: 44ch;
      color: var(--muted);
      font-size: 1.3125rem;
      letter-spacing: -.014em;
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }
    .btn-row { display: flex; gap: .9rem; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .75rem 1.5rem;
      border-radius: 980px;
      font-family: inherit;
      font-size: 1.0625rem;
      letter-spacing: -.014em;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background .25s var(--ease), color .25s var(--ease), transform .25s var(--ease);
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      background: var(--accent-btn);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-btn-hover); }
    .btn-ghost {
      background: rgba(255,255,255,.08);
      color: var(--text);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.14); }

    /* stat row */
    .stats-row {
      display: flex;
      gap: 3.5rem;
      padding-top: 3.5rem;
      flex-wrap: wrap;
    }
    .stat-item { text-align: center; }
    .stat-num {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.1;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .stat-label { font-size: .8125rem; color: var(--muted); margin-top: .3rem; }

    /* bento highlights */
    .bento {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 1.125rem;
    }
    @media (max-width: 700px) { .bento { grid-template-columns: 1fr; } }
    .bento-tile {
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 1.875rem;
      display: flex;
      flex-direction: column;
      gap: .65rem;
    }
    .bento-label {
      display: flex;
      align-items: center;
      font-size: .8125rem;
      font-weight: 600;
      color: var(--muted);
    }
    .bento-title {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -.018em;
    }
    .bento-text { color: var(--text2); font-size: .9375rem; line-height: 1.55; }
    .bento-meta { color: var(--muted); font-size: .8125rem; margin-top: auto; padding-top: .5rem; }
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      margin-right: .5rem;
      animation: pulse 2.4s var(--ease) infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(48,209,88,.45); }
      70%  { box-shadow: 0 0 0 9px rgba(48,209,88,0); }
      100% { box-shadow: 0 0 0 0 rgba(48,209,88,0); }
    }

    /* writing / substack */
    .writing { margin-top: 1.125rem; }
    .writing-card {
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 1.875rem;
      display: flex;
      align-items: flex-start;
      gap: 1.25rem;
      transition: border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);
    }
    .writing-card:hover {
      border-color: rgba(255,255,255,.18);
      transform: translateY(-3px);
      box-shadow: 0 18px 36px rgba(0,0,0,.45);
    }
    .writing-icon {
      width: 52px;
      height: 52px;
      border-radius: 13px;
      background: linear-gradient(135deg, rgba(41,151,255,.18), rgba(191,90,242,.18));
      border: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .writing-body { display: flex; flex-direction: column; gap: .65rem; }
    .writing-title { font-size: 1.375rem; font-weight: 600; letter-spacing: -.018em; }
    .writing-text { color: var(--text2); font-size: .9375rem; line-height: 1.55; max-width: 56ch; }
    .writing-body .btn-row { margin-top: .35rem; }
    @media (max-width: 700px) { .writing-card { flex-direction: column; } }

    /* ── EXPERIENCE ── */
    .projects-header { padding: 5rem 0 2.5rem; }
    .projects-header h1 {
      font-size: clamp(2.25rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -.022em;
      margin-bottom: .75rem;
    }
    .projects-header p { color: var(--muted); font-size: 1.1875rem; letter-spacing: -.014em; max-width: 52ch; }

    .proj-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.125rem;
      padding-bottom: 5rem;
    }
    .proj-card {
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 1.625rem;
      display: flex;
      flex-direction: column;
      gap: .8rem;
      transition: border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);
    }
    .proj-card:hover {
      border-color: rgba(255,255,255,.18);
      transform: translateY(-4px);
      box-shadow: 0 24px 48px rgba(0,0,0,.5);
    }
    .proj-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(41,151,255,.18), rgba(191,90,242,.18));
      border: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.375rem;
      line-height: 1;
    }
    .proj-name { font-weight: 600; font-size: 1.1875rem; letter-spacing: -.018em; }
    .proj-desc { color: var(--muted); font-size: .9375rem; line-height: 1.55; flex: 1; }
    .proj-tags { display: flex; flex-wrap: wrap; gap: .4rem; }
    .tag {
      font-size: .75rem;
      font-weight: 500;
      padding: .3rem .75rem;
      border-radius: 980px;
      color: var(--text2);
      background: rgba(255,255,255,.07);
      letter-spacing: -.006em;
    }
    .tag.green { color: var(--green); background: rgba(48,209,88,.12); }
    .tag.cyan  { color: var(--cyan);  background: rgba(100,210,255,.1); }
    .proj-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .8125rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: .9rem;
      margin-top: .25rem;
    }
    .proj-link { color: var(--accent); font-size: .875rem; }
    .proj-link:hover { text-decoration: underline; }

    /* ── ABOUT ── */
    .about-layout { display: grid; grid-template-columns: 1fr 340px; gap: 3rem; padding: 5rem 0; align-items: start; }
    @media (max-width: 700px) { .about-layout { grid-template-columns: 1fr; } }
    .about p { color: var(--text2); line-height: 1.65; letter-spacing: -.01em; margin-bottom: 1.1rem; }
    .about p strong { color: var(--text); font-weight: 600; }
    .about p a { color: var(--accent); }
    .about p a:hover { text-decoration: underline; }

    .about-card {
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      overflow: hidden;
    }
    .about-card-header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
      font-size: .9375rem;
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--text);
    }
    .about-card-body { padding: 1.25rem; }
    .info-row { display: flex; justify-content: space-between; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid var(--border); font-size: .9375rem; }
    .info-row:last-child { border-bottom: none; }
    .info-key { color: var(--muted); }
    .info-val { color: var(--text); font-weight: 500; text-align: right; }
    .skill-list { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .75rem; }
    .now-list { font-size: .9375rem; color: var(--muted); line-height: 2; }
    .now-list span { color: var(--text); }

    /* ── CONTACT ── */
    .contact-layout { padding: 5rem 0; }
    .contact-layout h1 {
      font-size: clamp(2.25rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -.022em;
      margin-bottom: .75rem;
    }
    .contact-layout > p { color: var(--muted); font-size: 1.1875rem; letter-spacing: -.014em; margin-bottom: 2.5rem; max-width: 50ch; }

    .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.125rem; }
    .contact-card {
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 1.375rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);
      cursor: pointer;
    }
    .contact-card:hover {
      border-color: rgba(255,255,255,.18);
      transform: translateY(-3px);
      box-shadow: 0 18px 36px rgba(0,0,0,.45);
    }
    .contact-icon {
      width: 44px;
      height: 44px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(41,151,255,.18), rgba(191,90,242,.18));
      border: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .contact-info-name { font-weight: 600; font-size: 1rem; letter-spacing: -.01em; }
    .contact-info-val { font-size: .8125rem; color: var(--muted); margin-top: .15rem; }

    .form-wrap {
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 22px;
      padding: 2rem;
      margin-top: 2rem;
    }
    .form-wrap h2 { font-size: 1.375rem; font-weight: 600; letter-spacing: -.018em; margin-bottom: 1.5rem; }
    .field { margin-bottom: 1.125rem; }
    .field label { display: block; font-size: .875rem; font-weight: 500; color: var(--text2); margin-bottom: .45rem; }
    .field input, .field textarea {
      width: 100%;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 1.0625rem;
      letter-spacing: -.01em;
      padding: .75rem 1rem;
      outline: none;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
      resize: vertical;
    }
    .field input::placeholder, .field textarea::placeholder { color: var(--muted); }
    .field input:focus, .field textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(41,151,255,.2);
    }
    .field textarea { min-height: 120px; }
    .form-note { font-size: .8125rem; color: var(--muted); margin-top: 1.1rem; line-height: 1.6; }
    .form-note a { color: var(--accent); }
    .form-note a:hover { text-decoration: underline; }

    /* ── DASHBOARD ── */
    .dash { position: relative; display: grid; gap: 1.125rem; }
    .dash-card {
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 1.875rem;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .dash-head { display: flex; flex-direction: column; gap: .35rem; margin-bottom: 1.25rem; }
    .dash-sub { color: var(--muted); font-size: .875rem; line-height: 1.5; }
    .dash-split { display: grid; grid-template-columns: 1.6fr 1fr; gap: 1.125rem; }
    .dash-stack { display: flex; flex-direction: column; gap: 1.125rem; }
    .dash-stack > :last-child { flex: 1; }
    .dash-note { color: var(--muted); font-size: .8125rem; margin-top: 1.5rem; }
    .dash-note a { color: var(--accent); }
    .dash-note a:hover { text-decoration: underline; }

    .dash-hit {
      border-radius: 10px;
      padding: 0 .5rem;
      margin: 0 -.5rem;
      transition: background .2s var(--ease);
    }
    .dash-hit:hover { background: rgba(255,255,255,.04); }
    .dash-hit:focus-visible, .dash-data summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    @keyframes grow { from { transform: scaleX(0); } }

    /* key figures */
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.125rem; }
    .kpi {
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 1.375rem;
      display: flex;
      flex-direction: column;
      gap: .3rem;
    }
    .kpi-value { display: flex; align-items: baseline; gap: .4rem; }
    .kpi-unit { font-size: .9375rem; font-weight: 600; color: var(--muted); }
    .kpi-sub { font-size: .8125rem; color: var(--muted); line-height: 1.4; }

    /* timeline */
    .tl-row { display: grid; grid-template-columns: 200px 1fr; gap: 1rem; align-items: center; }
    .tl-name { display: block; font-size: .9375rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
    .tl-org { display: block; font-size: .8125rem; color: var(--muted); }
    .tl-track { position: relative; height: 56px; }
    .tl-tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.08); }
    .tl-bar {
      position: absolute;
      top: 50%;
      height: 14px;
      margin-top: -7px;
      min-width: 4px;
      background: var(--accent);
      border-radius: 4px;
      transform-origin: left center;
      animation: grow .7s var(--ease) both;
    }
    .tl-now {
      position: absolute;
      top: 50%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 5px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 2px var(--surface);
    }
    .tl-axis .tl-track { height: 1.75rem; }
    .tl-year {
      position: absolute;
      top: .45rem;
      text-align: center;
      font-size: .75rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* toolkit bars */
    .sk-row { display: grid; grid-template-columns: 140px 1fr 1.75rem; gap: .9rem; align-items: center; min-height: 34px; }
    .sk-name { font-size: .875rem; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sk-track { height: 10px; border-radius: 0 4px 4px 0; background: rgba(41,151,255,.14); }
    .sk-fill {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 0 4px 4px 0;
      transform-origin: left center;

    .dash-clock { margin: .6rem 0 .35rem; }

      position: absolute;
      z-index: 10;
      pointer-events: none;
      min-width: 160px;
      max-width: 280px;
      padding: .7rem .85rem;
      background: rgba(44,44,46,.92);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0,0,0,.5);
      font-size: .8125rem;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      gap: .1rem;

    .dash-tip-value { font-size: 1rem; font-weight: 600; color: var(--text); }
    .dash-tip-title { color: var(--text2); }
    .dash-tip-line { color: var(--muted); }

    /* table view */

    .dash-data summary { width: fit-content; color: var(--accent); cursor: pointer; list-style: none; border-radius: 6px; }
    .dash-data summary::-webkit-details-marker { display: none; }
    .dash-data summary::after { content: '›'; display: inline-block; margin-left: .35rem; transition: transform .2s var(--ease); }
    .dash-data[open] summary::after { transform: rotate(90deg); }
    .dash-table-wrap { overflow-x: auto; margin-top: .75rem; }
    .dash-table { width: 100%; border-collapse: collapse; }
    .dash-table th, .dash-table td { text-align: left; vertical-align: top; padding: .5rem .75rem .5rem 0; border-bottom: 1px solid var(--border); }
    .dash-table th:last-child, .dash-table td:last-child { padding-right: 0; }
    .dash-table th { color: var(--muted); font-weight: 500; }
    .dash-table td { color: var(--text2); }
    .dash-table .num { text-align: right; font-variant-numeric: tabular-nums; }
    .dash-table tr:last-child td { border-bottom: none; }

    @media (max-width: 700px) {
      .dash-split { grid-template-columns: 1fr; }
      .dash-card { padding: 1.375rem; }
      .tl-row { grid-template-columns: 1fr; gap: .1rem; padding-top: .5rem; }

    /* ── Mobile nav toggle ── */
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      padding: .35rem .5rem;
      cursor: pointer;
      color: var(--text);

<script>
  // ── Router ──────────────────────────────────────
  const PAGES = ['home', 'experience', 'projects', 'dashboard', 'about', 'contact'];
  let current = 'home';

  function getPage() {
    const hash = location.hash.replace('#', '');
    return PAGES.includes(hash) ? hash : 'home';
  }

  function navigate(page, push = true) {
    if (page === current && document.getElementById('page').children.length) return;
    const el = document.getElementById('page');

    // exit animation
    el.classList.add('leaving');

    setTimeout(() => {
      // swap content
      const tpl = document.getElementById('tpl-' + page);
      el.innerHTML = '';
      el.appendChild(tpl.content.cloneNode(true));
      if (page === 'dashboard') renderDashboard();
      el.classList.remove('leaving');
      current = page;

      // update nav
      document.querySelectorAll('.nav-links a').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });

      // update URL
      if (push) history.pushState({ page }, '', page === 'home' ? location.pathname : '#' + page);

      // scroll to top
      window.scrollTo({ top: 0 });

      // bind inner links (only the new page's — nav/footer are bound once on init)
      bindLinks(el);
    }, 180);
  }

  function bindLinks(root = document) {
    root.querySelectorAll('[data-page]').forEach(el => {
      el.addEventListener('click', e => {
        const p = el.dataset.page;
        if (PAGES.includes(p)) { e.preventDefault(); navigate(p); }
      });
    });
  }

  // ── Init ────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('year').textContent = new Date().getFullYear();
    navigate(getPage(), false);

    // nav mobile toggle
    const toggle = document.getElementById('nav-toggle');
    const links  = document.getElementById('nav-links');
    toggle.addEventListener('click', () => links.classList.toggle('open'));
    links.addEventListener('click', () => links.classList.remove('open'));

    // nav data-page links
    bindLinks();
  });

  window.addEventListener('popstate', e => {
    navigate(e.state?.page || getPage(), false);
  });

  // ── Dashboard ───────────────────────────────────
  // Every figure is derived from the Experience and Projects templates,
  // so the dashboard stays in sync as cards are added or edited.
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  // "Jun 2025" → months since year 0 (null if unparseable)
  function monthIndex(text) {
    const m = /^([a-z]{3})[a-z]*\.?\s+(\d{4})$/i.exec(text.trim());
    const i = m ? MONTHS.findIndex(n => n.toLowerCase() === m[1].toLowerCase()) : -1;
    return i < 0 ? null : Number(m[2]) * 12 + i;
  }
  const monthLabel = i => MONTHS[i % 12] + ' ' + Math.floor(i / 12);
  const plural = (n, word) => n + ' ' + word + (n === 1 ? '' : 's');

  function make(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function readCards(tplId) {
    return [...document.getElementById(tplId).content.querySelectorAll('.proj-card')].map(card => {
      const text = sel => (card.querySelector(sel)?.textContent || '').trim();
      const tags = [...card.querySelectorAll('.tag')];
      return {
        name:   text('.proj-name'),
        org:    text('.proj-link').replace(/›$/, '').trim(),
        when:   text('.proj-footer span'),
        // green tags carry status/results ("Current", "−50% response time"), the rest are skills
        skills: tags.filter(t => !t.classList.contains('green')).map(t => t.textContent.trim()),
        status: tags.filter(t => t.classList.contains('green')).map(t => t.textContent.trim()),
      };
    });
  }

  function dashboardData() {
    const now = new Date();
    const nowIdx = now.getFullYear() * 12 + now.getMonth();
    const roles = readCards('tpl-experience').map(c => {
      const [from = '', to = ''] = c.when.split(/\s*[–—-]\s*/);
      const current = /present/i.test(to);
      return { ...c, kind: 'Role', current, start: monthIndex(from), end: current ? nowIdx : monthIndex(to) };
    }).filter(r => r.start != null && r.end != null && r.end >= r.start)
      .sort((a, b) => a.start - b.start);
    const projects = readCards('tpl-projects').map(c => ({
      ...c, kind: 'Project', current: c.status.some(s => /ongoing|current/i.test(s)),
    }));
    return { now, nowIdx, roles, projects };
  }

  // Hover/focus tooltip. Everything it shows is also in the labels or the data table.
  function bindTip(target, info) {
    const tip = document.getElementById('dash-tip');
    const box = document.getElementById('dash');
    const place = (x, y) => {
      const r = box.getBoundingClientRect();
      let left = x - r.left + 14;
      let top = y - r.top + 14;
      if (left + tip.offsetWidth > r.width) left = x - r.left - tip.offsetWidth - 14;
      if (y + 14 + tip.offsetHeight > window.innerHeight) top = y - r.top - tip.offsetHeight - 14;
      tip.style.left = Math.max(0, left) + 'px';
      tip.style.top = top + 'px';
    };
    const show = () => {
      tip.replaceChildren(
        make('strong', 'dash-tip-value', info.value),
        make('span', 'dash-tip-title', info.title),
        ...info.lines.map(l => make('span', 'dash-tip-line', l)));
      tip.hidden = false;
    };
    const hide = () => { tip.hidden = true; };
    target.tabIndex = 0;
    target.setAttribute('role', 'img');
    target.setAttribute('aria-label', [info.title, info.value, ...info.lines].join('. '));
    target.addEventListener('pointerenter', e => { show(); place(e.clientX, e.clientY); });
    target.addEventListener('pointermove', e => place(e.clientX, e.clientY));
    target.addEventListener('pointerleave', hide);
    target.addEventListener('focus', () => {
      show();
      const b = target.getBoundingClientRect();
      place(b.left + b.width / 2, b.bottom);
    });
    target.addEventListener('blur', hide);
  }

  // Collapsible table twin of a chart
  function dataTable(cols, rows) {
    const details = make('details', 'dash-data');
    const table = make('table', 'dash-table');
    const head = table.createTHead().insertRow();
    cols.forEach(c => {
      const th = make('th', c.num ? 'num' : null, c.label);
      th.scope = 'col';
      head.append(th);
    });
    const body = table.createTBody();
    rows.forEach(row => {
      const tr = body.insertRow();
      row.forEach((v, i) => {
        const td = tr.insertCell();
        td.textContent = v;
        if (cols[i].num) td.className = 'num';
      });
    });
    const wrap = make('div', 'dash-table-wrap');
    wrap.append(table);
    details.append(make('summary', null, 'Data table'), wrap);
    return details;
  }

  function renderKpis(d) {
    const months = new Set();
    d.roles.forEach(r => { for (let m = r.start; m <= r.end; m++) months.add(m); });
    const tiles = [
      { label: 'Experience', value: months.size, unit: months.size === 1 ? 'month' : 'months',
        sub: d.roles.length ? 'Since ' + monthLabel(d.roles[0].start) : '' },
      { label: 'Roles', value: d.roles.length, sub: d.roles.filter(r => r.current).length + ' current' },
      { label: 'Projects', value: d.projects.length, sub: d.projects.filter(p => p.current).length + ' ongoing' },
    ];
    // result tags ("−50% response time") become their own tiles
    [...d.roles, ...d.projects].forEach(c => c.status.forEach(s => {
      const m = /^([−+-]?\d[\d.,]*%?)\s+(.+)$/.exec(s);
      if (m) tiles.push({ label: m[2][0].toUpperCase() + m[2].slice(1), value: m[1], sub: c.name });
    }));

    const row = document.getElementById('dash-kpis');
    tiles.forEach(t => {
      const tile = make('div', 'kpi');
      const value = make('div', 'kpi-value');
      value.append(make('span', 'stat-num', String(t.value)));
      if (t.unit) value.append(make('span', 'kpi-unit', t.unit));
      tile.append(make('p', 'bento-label', t.label), value, make('p', 'kpi-sub', t.sub));
      row.append(tile);
    });
  }

  function renderTimeline(d) {
    const box = document.getElementById('dash-timeline');
    if (!d.roles.length) return;

    // whole calendar years, from the first role through the current year
    const y0 = Math.floor(d.roles[0].start / 12);
    const y1 = Math.floor(Math.max(d.nowIdx, ...d.roles.map(r => r.end)) / 12) + 1;
    const pct = m => (m - y0 * 12) / ((y1 - y0) * 12) * 100;
    const daysInMonth = new Date(d.now.getFullYear(), d.now.getMonth() + 1, 0).getDate();
    const today = d.nowIdx + (d.now.getDate() - 1) / daysInMonth;

    d.roles.forEach((r, i) => {
      const months = r.end - r.start + 1;
      const endPos = r.current ? today : r.end + 1;
      const row = make('div', 'tl-row dash-hit');
      const label = make('div', 'tl-label');
      label.append(make('span', 'tl-name', r.name), make('span', 'tl-org', r.org + ' · ' + months + ' mo'));
      const track = make('div', 'tl-track');
      for (let y = y0; y <= y1; y++) {
        const tick = make('span', 'tl-tick');
        tick.style.left = pct(y * 12) + '%';
        track.append(tick);
      }
      const bar = make('span', 'tl-bar');
      bar.style.left = pct(r.start) + '%';
      bar.style.width = (pct(endPos) - pct(r.start)) + '%';
      bar.style.animationDelay = i * 80 + 'ms';
      track.append(bar);
      if (r.current) {
        const dot = make('span', 'tl-now');
        dot.style.left = pct(endPos) + '%';
        track.append(dot);
      }
      row.append(label, track);
      bindTip(row, { value: plural(months, 'month'), title: r.name + ' · ' + r.org, lines: [r.when] });
      box.append(row);
    });

    const axis = make('div', 'tl-row tl-axis');
    const axisTrack = make('div', 'tl-track');
    for (let y = y0; y < y1; y++) {
      const year = make('span', 'tl-year', String(y));
      year.style.left = pct(y * 12) + '%';
      year.style.width = 100 / (y1 - y0) + '%';
      axisTrack.append(year);
    }
    axis.append(make('div', 'tl-label'), axisTrack);
    box.append(axis);

    box.parentElement.append(dataTable(
      [{ label: 'Role' }, { label: 'Organization' }, { label: 'Start' }, { label: 'End' }, { label: 'Months', num: true }],
      d.roles.map(r => [r.name, r.org, monthLabel(r.start), r.current ? 'Present' : monthLabel(r.end), r.end - r.start + 1])));
  }

  function renderSkills(d) {
    const items = [...d.roles, ...d.projects];
    const uses = new Map();
    items.forEach(it => new Set(it.skills).forEach(s => uses.set(s, [...(uses.get(s) || []), it])));
    const skills = [...uses].map(([name, list]) => ({ name, list }))
      .sort((a, b) => b.list.length - a.list.length || a.name.localeCompare(b.name));
    const where = it => it.kind === 'Role' ? it.name + ' (' + it.org + ')' : it.name;

    document.getElementById('dash-skills-sub').textContent =
      'How many of my ' + items.length + ' roles and projects use each skill.';
    const box = document.getElementById('dash-skills');
    skills.forEach((s, i) => {
      const row = make('div', 'sk-row dash-hit');
      const track = make('div', 'sk-track');
      const fill = make('span', 'sk-fill');
      fill.style.width = s.list.length / items.length * 100 + '%';
      fill.style.animationDelay = i * 40 + 'ms';
      track.append(fill);
      row.append(make('span', 'sk-name', s.name), track, make('span', 'sk-val', String(s.list.length)));
      bindTip(row, { value: s.list.length + ' of ' + items.length, title: s.name, lines: s.list.map(where) });
      box.append(row);
    });

    box.parentElement.append(dataTable(
      [{ label: 'Skill' }, { label: 'Count', num: true }, { label: 'Used in' }],
      skills.map(s => [s.name, s.list.length, s.list.map(where).join(', ')])));
  }

  function renderNow(d) {
    const box = document.getElementById('dash-now');
    const live = [...d.roles.filter(r => r.current).reverse(), ...d.projects.filter(p => p.current)];
    if (!live.length) { box.append(make('p', 'dash-sub', 'Nothing in progress right now.')); return; }
    live.forEach(it => {
      const item = make('div', 'dash-now-item');
      const meta = it.kind === 'Role' ? it.org + ' · Role since ' + monthLabel(it.start) : it.org + ' · Project';
      item.append(make('span', 'dash-now-name', it.name), make('span', 'dash-now-meta', meta));
      box.append(item);
    });
  }

  function renderClock() {
    const clock = document.getElementById('dash-clock');
    const sub = document.getElementById('dash-clock-sub');
    const zone = 'Asia/Manila';
    const time = new Intl.DateTimeFormat('en-US', { timeZone: zone, hour: 'numeric', minute: '2-digit' });
    const day = new Intl.DateTimeFormat('en-US', { timeZone: zone, weekday: 'long' });
    // Manila is UTC+8 year-round; getTimezoneOffset() is the viewer's (UTC − local) in minutes
    const diff = (480 + new Date().getTimezoneOffset()) / 60;
    const rel = diff === 0 ? 'same time zone as you'
      : plural(+Math.abs(diff).toFixed(2), 'hour') + (diff > 0 ? ' ahead of you' : ' behind you');
    const tick = () => {
      if (!clock.isConnected) return clearInterval(timer);
      const now = new Date();
      clock.textContent = time.format(now);
      sub.textContent = day.format(now) + ' in the Philippines · ' + rel;
    };
    const timer = setInterval(tick, 10000);
    tick();
  }

  function renderDashboard() {
    const d = dashboardData();
    renderKpis(d);
    renderTimeline(d);
    renderSkills(d);
    renderNow(d);
    renderClock();
  }

  // ── Contact form stub ───────────────────────────
  function handleFormSubmit(e) {
    e.preventDefault();
    const btn = e.target;
    btn.textContent = 'Sent ✓';
    btn.style.color = 'var(--green)';
    btn.disabled = true;
  }
</script>
